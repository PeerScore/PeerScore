services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgres://peerscore:peerscore@db:5432/peerscore
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev -- -H 0.0.0.0

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peerscore
      POSTGRES_PASSWORD: peerscore
      POSTGRES_DB: peerscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerscore -d peerscore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
